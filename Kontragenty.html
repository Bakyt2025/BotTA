<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор магазина</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f2f2f7; margin: 0; padding: 15px; }
        .search { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; }
        .card { background: white; border-radius: 14px; margin-bottom: 10px; display: flex; align-items: center; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .geo-btn { width: 60px; height: 70px; background: #e5f1f6; display: flex; align-items: center; justify-content: center; font-size: 24px; border-right: 1px solid #eee; cursor: pointer; }
        .info-area { flex: 1; padding: 12px; cursor: pointer; }
        .name { font-weight: 600; font-size: 16px; color: #1c1c1e; }
        .addr { font-size: 13px; color: #8e8e93; margin-top: 3px; }
    </style>
</head>
<body>
    <input type="text" id="search" class="search" placeholder="🔍 Поиск магазина...">
    <div id="list"></div>

    <script>
        let tg = window.Telegram.WebApp;
        let clients = [];

        async function load() {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            clients = d.clients;
            render();
        }

        function selectClient(c, withGeo) {
            if (withGeo) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    c.currentCoords = pos.coords.latitude + "," + pos.coords.longitude;
                    finish(c);
                }, (err) => {
                    alert("Ошибка GPS. Проверьте разрешения.");
                    c.currentCoords = "0,0";
                    finish(c);
                });
            } else {
                c.currentCoords = "0,0"; // Дистанционный заказ
                finish(c);
            }
        }

        function finish(c) {
            localStorage.setItem('selectedClient', JSON.stringify(c));
            window.location.href = 'Nomenklatura.html';
        }

        function render() {
            const term = document.getElementById('search').value.toLowerCase();
            const cont = document.getElementById('list');
            cont.innerHTML = '';
            clients.filter(c => c.name.toLowerCase().includes(term)).forEach(c => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div class="geo-btn" onclick="event.stopPropagation(); selectClient(${JSON.stringify(c).replace(/"/g, '&quot;')}, true)">📍</div>
                    <div class="info-area" onclick="selectClient(${JSON.stringify(c).replace(/"/g, '&quot;')}, false)">
                        <div class="name">${c.name}</div>
                        <div class="addr">${c.address}</div>
                    </div>
                `;
                cont.appendChild(div);
            });
        }
        document.getElementById('search').oninput = render;
        load();
    </script>
</body>
</html>
