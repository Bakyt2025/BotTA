<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор магазина</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f2f2f7; margin: 0; padding: 15px; }
        .search { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        .card { background: white; border-radius: 14px; margin-bottom: 10px; display: flex; align-items: center; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); min-height: 70px; }
        .geo-btn { width: 60px; align-self: stretch; background: #e5f1f6; display: flex; align-items: center; justify-content: center; font-size: 24px; border-right: 1px solid #eee; cursor: pointer; }
        .info-area { flex: 1; padding: 12px; cursor: pointer; }
        .name { font-weight: 600; font-size: 16px; color: #1c1c1e; line-height: 1.2; }
        .addr { font-size: 13px; color: #8e8e93; margin-top: 3px; }
        #loading-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.8); z-index: 1000; justify-content: center; align-items: center; font-weight: bold; }
    </style>
</head>
<body>
    <div id="loading-overlay">⏳ Получение GPS...</div>
    <input type="text" id="search" class="search" placeholder="🔍 Поиск магазина...">
    <div id="list">Загрузка списка...</div>

    <script>
        let tg = window.Telegram.WebApp;
        let clients = [];
        let filtered = [];

        async function load() {
            try {
                const r = await fetch('data.json?v=' + Date.now());
                const d = await r.json();
                clients = d.clients || [];
                render();
            } catch (e) { document.getElementById('list').innerText = "Ошибка загрузки данных."; }
        }

        function render() {
            const term = document.getElementById('search').value.toLowerCase();
            const cont = document.getElementById('list');
            cont.innerHTML = '';
            
            filtered = clients.filter(c => c.name.toLowerCase().includes(term));

            filtered.forEach((c, idx) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div class="geo-btn" onclick="selectWithGPS(${idx})">📍</div>
                    <div class="info-area" onclick="selectSimple(${idx})">
                        <div class="name">${c.name}</div>
                        <div class="addr">${c.address}</div>
                    </div>
                `;
                cont.appendChild(div);
            });
        }

        window.selectSimple = function(idx) {
            let c = filtered[idx];
            c.currentCoords = "0,0";
            finish(c);
        }

        window.selectWithGPS = function(idx) {
            let c = filtered[idx];
            document.getElementById('loading-overlay').style.display = 'flex';
            
            navigator.geolocation.getCurrentPosition((pos) => {
                c.currentCoords = pos.coords.latitude + "," + pos.coords.longitude;
                finish(c);
            }, (err) => {
                alert("Не удалось получить GPS. Проверьте включен ли Гео в телефоне.");
                c.currentCoords = "0,0";
                finish(c);
            }, { enableHighAccuracy: true, timeout: 7000 });
        }

        function finish(c) {
            localStorage.setItem('selectedClient', JSON.stringify(c));
            window.location.href = 'Nomenklatura.html';
        }

        document.getElementById('search').oninput = render;
        load();
    </script>
</body>
</html>
