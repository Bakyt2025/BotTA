<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор магазина</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f2f2f7; margin: 0; padding: 15px; }
        .header { position: sticky; top: 0; background: #f2f2f7; padding-bottom: 10px; z-index: 10; }
        .search { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; outline: none; box-sizing: border-box; }
        .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }
        .name { font-weight: 600; font-size: 17px; color: #007aff; }
        .addr { font-size: 14px; color: #8e8e93; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="header"><input type="text" id="search" class="search" placeholder="🔍 Поиск магазина..."></div>
    <div id="list"></div>

    <script>
        let tg = window.Telegram.WebApp;
        let clients = [];

        async function load() {
            const r = await fetch('data.json');
            const d = await r.json();
            clients = d.clients;
            render();
        }

        function render() {
            const term = document.getElementById('search').value.toLowerCase();
            const cont = document.getElementById('list');
            cont.innerHTML = '';
            clients.filter(c => c.name.toLowerCase().includes(term) || c.address.toLowerCase().includes(term)).forEach(c => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<div class="name">${c.name}</div><div class="addr">${c.address}</div>`;
                div.onclick = () => {
                    localStorage.setItem('selectedClient', JSON.stringify(c));
                    // МГНОВЕННЫЙ ПЕРЕХОД К ТОВАРАМ
                    window.location.href = 'Nomenklatura.html';
                };
                cont.appendChild(div);
            });
        }
        document.getElementById('search').oninput = render;
        load();
    </script>
</body>
</html>
