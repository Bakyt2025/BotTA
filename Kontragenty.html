<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор клиента</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f2f2f7;
            --accent: #007aff;
            --card-bg: #ffffff;
            --text: #1c1c1e;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .header { position: sticky; top: 0; background: var(--bg); padding-bottom: 10px; z-index: 10; }
        h2 { font-size: 22px; margin: 0 0 15px 0; }
        .search { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; outline: none; box-sizing: border-box; }
        .client-card { 
            background: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 12px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.1s;
        }
        .client-card:active { transform: scale(0.98); background: #f9f9f9; }
        .name { font-weight: 600; font-size: 17px; margin-bottom: 4px; color: var(--accent); }
        .info { font-size: 14px; color: #8e8e93; line-height: 1.3; }
        .coords { font-size: 11px; color: #c7c7cc; margin-top: 8px; display: block; }
    </style>
</head>
<body>

<div class="header">
    <h2>🤝 Контрагенты</h2>
    <input type="text" id="search" class="search" placeholder="Поиск по названию или адресу...">
</div>

<div id="list"></div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let clients = [];

    async function loadClients() {
        try {
            // Загружаем данные из вашего единого data.json
            const response = await fetch('data.json');
            const data = await response.json();
            clients = data.clients;
            render();
        } catch (e) { console.error("Ошибка загрузки"); }
    }

    function render() {
        const term = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('list');
        container.innerHTML = '';

        clients.forEach(c => {
            if (c.name.toLowerCase().includes(term) || c.address.toLowerCase().includes(term)) {
                const div = document.createElement('div');
                div.className = 'client-card';
                div.innerHTML = `
                    <div class="name">${c.name}</div>
                    <div class="info">📍 ${c.address}</div>
                    <div class="info">📞 ${c.phone || ''}</div>
                    <span class="coords">${c.coords}</span>
                `;
                div.onclick = () => {
                    // Сохраняем выбранного клиента в память браузера
                    localStorage.setItem('selectedClient', JSON.stringify(c));
                    // Переходим на страницу товаров
                    window.location.href = 'Nomenklatura.html';
                };
                container.appendChild(div);
            }
        });
    }

    document.getElementById('search').oninput = render;
    loadClients();
</script>
</body>
</html>
