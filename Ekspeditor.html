<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Экспедитор PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F8F9FA;
            color: #000000;
            margin: 0;
            padding: 0;
        }

        /* Заголовок (Дата) */
        header {
            padding: 20px;
            background: #FFFFFF;
            border-bottom: 3px solid #000000;
            text-align: center;
        }

        header h2 {
            font-size: 20px;
            font-weight: 900;
            margin: 0;
        }

        /* Поиск */
        .search-wrapper {
            padding: 15px 20px;
            position: sticky;
            top: 0;
            background: #F8F9FA;
            z-index: 100;
        }

        .search-bar {
            background: #FFFFFF;
            border: 2px solid #000000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 12px 15px;
        }

        .search-bar input {
            background: none;
            border: none;
            outline: none;
            width: 100%;
            font-size: 18px;
            font-weight: 800;
            color: #000000;
        }

        /* Список карточек */
        #shop-list {
            padding: 10px 15px 100px 15px;
        }

        .card {
            background: #FFFFFF;
            border: 2px solid #000000;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .full-name {
            font-size: 19px;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 15px;
            display: block;
        }

        .divider {
            height: 2px;
            background: #000000;
            margin: 15px 0;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .amount-info {
            display: flex;
            flex-direction: column;
        }

        .amount-label {
            font-size: 13px;
            font-weight: 900;
        }

        .amount-value {
            font-size: 24px;
            font-weight: 900;
            color: #006400; /* Темно-зеленый */
        }

        /* Кнопка "В ПУТЬ" */
        .btn-go {
            background-color: #007AFF;
            color: #FFFFFF;
            border: 2px solid #000000;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-go:active {
            background-color: #000000;
        }

        #loader { text-align: center; padding: 50px; font-weight: 900; font-size: 18px; }
    </style>
</head>
<body>

<header>
    <h2 id="sheet-date">ЗАГРУЗКА...</h2>
</header>

<div class="search-wrapper">
    <div class="search-bar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right:10px"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search" placeholder="ПОИСК МАГАЗИНА" oninput="filterShops()">
    </div>
</div>

<div id="loader">ПОДОЖДИТЕ...</div>
<div id="shop-list"></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    let allShops = [];

    async function loadData() {
        // МГНОВЕННОЕ ОБНОВЛЕНИЕ: Анти-кэш ссылка + заголовки
        const url = `https://raw.githubusercontent.com/Bakyt2025/BotTA/main/expeditor.json?v=${new Date().getTime()}`;
        
        try {
            const response = await fetch(url, {
                cache: 'no-store',
                headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
            });
            if (!response.ok) throw new Error();
            const data = await response.json();
            
            allShops = data.shops;
            document.getElementById('loader').style.display = 'none';
            document.getElementById('sheet-date').innerText = data.date;
            
            render(allShops);
        } catch (e) {
            document.getElementById('loader').innerHTML = "<b style='color:red'>ОШИБКА. ОБНОВИТЕ ДАННЫЕ В БОТЕ.</b>";
        }
    }

    function render(shops) {
        const container = document.getElementById('shop-list');
        container.innerHTML = '';

        shops.forEach(shop => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="full-name">${shop.name}</div>
                <div class="divider"></div>
                <div class="card-footer">
                    <div class="amount-info">
                        <span class="amount-label">НАКЛАДНАЯ №${shop.invoice}</span>
                        <span class="amount-value">${shop.amount} СОМ</span>
                    </div>
                    <button class="btn-go" onclick="openMap('${shop.coords}')">📍 В ПУТЬ</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterShops() {
        const q = document.getElementById('search').value.toLowerCase();
        const filtered = allShops.filter(s => s.name.toLowerCase().includes(q) || s.invoice.toLowerCase().includes(q));
        render(filtered);
    }

    function openMap(coords) {
        if (!coords || coords === "0,0") return tg.showAlert("НЕТ КООРДИНАТ");
        tg.openLink(`https://www.google.com/maps/search/?api=1&query=${coords.trim()}`);
    }

    loadData();
</script>

</body>
</html>
