<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Экспедитор Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --ios-bg: #FFFFFF;
            --ios-secondary-bg: #F2F2F7;
            --ios-label: #000000;
            --ios-secondary-label: #8E8E93;
            --ios-accent: #28CD41; /* Apple Green */
            --ios-card: #F2F2F7;
            --ios-border: #E5E5EA;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--ios-bg);
            color: var(--ios-label);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Large Title Header */
        header {
            padding: 40px 20px 10px 20px;
            background: var(--ios-bg);
        }

        header h1 {
            font-size: 34px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
        }

        header p {
            font-size: 15px;
            color: var(--ios-secondary-label);
            margin: 5px 0 0 0;
            font-weight: 400;
        }

        /* Search Bar */
        .search-wrapper {
            padding: 15px 20px;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
        }

        .search-bar {
            background: rgba(118, 118, 128, 0.12);
            border-radius: 15px;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border: none;
        }

        .search-bar input {
            background: none;
            border: none;
            outline: none;
            width: 100%;
            font-size: 17px;
            margin-left: 8px;
            color: var(--ios-label);
        }

        .search-bar svg {
            fill: var(--ios-secondary-label);
        }

        /* List container */
        #shop-list {
            padding: 10px 20px 100px 20px;
        }

        /* Card Style */
        .card {
            background: var(--ios-card);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--ios-border);
            transition: all 0.2s ease;
        }

        .card:active {
            transform: scale(0.97);
            background: var(--ios-border);
        }

        .shop-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            display: block;
            line-height: 1.2;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 8px;
            color: var(--ios-secondary-label);
            font-size: 14px;
            line-height: 1.4;
        }

        .info-item svg {
            margin-right: 10px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .divider {
            height: 1px;
            background: var(--ios-border);
            margin: 15px 0;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-tag {
            font-size: 22px;
            font-weight: 800;
            color: var(--ios-label);
        }

        .invoice-tag {
            font-size: 13px;
            font-weight: 500;
            color: var(--ios-secondary-label);
        }

        /* Action Button */
        .btn-go {
            background-color: var(--ios-accent);
            color: white;
            border: none;
            border-radius: 18px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(40, 205, 65, 0.2);
        }

        /* Detailed view (INN) hidden by default */
        .inn-text {
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.6;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--ios-secondary-label);
            font-size: 12px;
        }

        /* Loader */
        #loader { text-align: center; padding: 50px; color: var(--ios-secondary-label); }
    </style>
</head>
<body>

<header>
    <h1 id="sheet-date">Маршрутный лист</h1>
    <p id="sheet-subtitle">Экспедиторская панель</p>
</header>

<div class="search-wrapper">
    <div class="search-bar">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="search" placeholder="Поиск магазина или накладной" oninput="filterShops()">
    </div>
</div>

<div id="loader">Загрузка данных...</div>
<div id="shop-list"></div>

<footer id="footer-info"></footer>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    let allShops = [];

    // Красивый парсинг строки: "Название (Адрес, Телефон:000, ИНН:000)"
    function parseShopDetails(fullName) {
        let name = fullName;
        let address = "Адрес не указан";
        let phone = "";
        let inn = "";

        const match = fullName.match(/(.*?)\s*\((.*)\)/);
        if (match) {
            name = match[1].trim();
            const details = match[2];
            
            // Извлекаем ИНН
            const innMatch = details.match(/ИНН:\s*(\d+)/);
            if (innMatch) inn = innMatch[1];

            // Извлекаем Телефон
            const phoneMatch = details.match(/Телефон:\s*([\d\s+]+)/);
            if (phoneMatch) phone = phoneMatch[1];

            // Всё остальное до первого ключевого слова считаем адресом
            address = details.split(/Телефон:|ИНН:/)[0].replace(/,$/, '').trim();
        }

        return { name, address, phone, inn };
    }

    async function loadData() {
        const url = `https://raw.githubusercontent.com/Bakyt2025/BotTA/main/expeditor.json?v=${Date.now()}`;
        try {
            const r = await fetch(url);
            const data = await r.json();
            
            allShops = data.shops;
            document.getElementById('loader').style.display = 'none';
            document.getElementById('sheet-date').innerText = "Маршрут";
            document.getElementById('sheet-subtitle').innerText = data.date;
            document.getElementById('footer-info').innerText = "Последнее обновление: " + data.updated;

            render(allShops);
        } catch (e) {
            document.getElementById('loader').innerText = "Ошибка загрузки данных.";
        }
    }

    function render(shops) {
        const container = document.getElementById('shop-list');
        container.innerHTML = '';

        shops.forEach(shop => {
            const info = parseShopDetails(shop.name);
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="shop-name">${info.name}</div>
                
                <div class="info-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    ${info.address}
                </div>

                ${info.phone ? `
                <div class="info-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.88 12.88 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    ${info.phone}
                </div>` : ''}

                ${info.inn ? `<div class="inn-text">ИНН: ${info.inn}</div>` : ''}

                <div class="divider"></div>

                <div class="card-footer">
                    <div>
                        <div class="invoice-tag">Накладная №${shop.invoice}</div>
                        <div class="price-tag">${shop.amount} <small style="font-size:14px">сом</small></div>
                    </div>
                    <button class="btn-go" onclick="openMap('${shop.coords}')">📍 В ПУТЬ</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterShops() {
        const q = document.getElementById('search').value.toLowerCase();
        const filtered = allShops.filter(s => s.name.toLowerCase().includes(q) || s.invoice.toLowerCase().includes(q));
        render(filtered);
    }

    function openMap(coords) {
        if (!coords || coords === "0,0") return tg.showAlert("Координаты отсутствуют");
        tg.openLink(`https://www.google.com/maps/search/?api=1&query=${coords.trim()}`);
    }

    loadData();
</script>

</body>
</html>
