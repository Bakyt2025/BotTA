<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маршрутный лист</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; margin: 0; padding: 15px; }
        .header { text-align: center; font-weight: bold; margin-bottom: 20px; color: #333; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; 
                box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 5px solid #0088cc; }
        .shop-name { font-size: 18px; font-weight: bold; color: #0088cc; margin-bottom: 8px; }
        .info { font-size: 14px; color: #555; margin: 4px 0; }
        .btn-map { display: block; text-align: center; background: #34a853; color: white; 
                   text-decoration: none; padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: bold; }
        .amount { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>
    <div id="date-header" class="header">Загрузка...</div>
    <div id="list"></div>

    <script>
        // Путь к вашему JSON на гитхабе (raw версия)
        const jsonUrl = 'https://raw.githubusercontent.com/Bakyt2025/BotTA/main/Ekspeditor.json';

        fetch(jsonUrl + '?t=' + Date.now()) // t= нужен чтобы данные не кешировались
            .then(response => response.json())
            .then(data => {
                document.getElementById('date-header').innerText = data.date;
                const container = document.getElementById('list');
                
                data.shops.forEach(shop => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="shop-name">${shop.name}</div>
                        <div class="info">📄 Накладная: <b>${shop.invoice}</b></div>
                        <div class="info">💰 Сумма: <span class="amount">${shop.sum}</span></div>
                        <a class="btn-map" href="https://www.google.com/maps/search/?api=1&query=${shop.coords}">📍 Проложить маршрут</a>
                    `;
                    container.appendChild(card);
                });
            });
    </script>
</body>
</html>
