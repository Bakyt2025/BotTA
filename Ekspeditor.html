<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Маршрутный лист</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-secondary-bg-color, #f0f2f5);
            color: var(--tg-theme-text-color, #000);
            margin: 0; padding: 10px;
        }
        .header {
            text-align: center; margin-bottom: 15px;
        }
        .header h2 { margin: 5px 0; font-size: 18px; color: var(--tg-theme-hint-color, #888); }
        
        .card {
            background: var(--tg-theme-bg-color, #fff);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.1);
        }
        .shop-name { font-weight: bold; font-size: 17px; margin-bottom: 8px; color: var(--tg-theme-link-color, #248bcf); }
        .info-row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 14px; }
        .label { color: var(--tg-theme-hint-color, #888); }
        
        .btn-go {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #31b545;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }
        .btn-go:active { opacity: 0.8; }
        
        #loader { text-align: center; margin-top: 50px; color: #888; }
    </style>
</head>
<body>

<div class="header">
    <h3 id="sheet-date">Загрузка...</h3>
    <div id="update-time" style="font-size: 12px; color: gray;"></div>
</div>

<div id="loader">Получение данных из GitHub...</div>
<div id="container"></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    async function loadData() {
        const jsonUrl = `https://raw.githubusercontent.com/Bakyt2025/BotTA/main/expeditor.json?v=${Date.now()}`;
        try {
            const response = await fetch(jsonUrl);
            const data = await response.json();
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('sheet-date').innerText = data.date;
            document.getElementById('update-time').innerText = "Обновлено: " + data.updated;

            const container = document.getElementById('container');
            container.innerHTML = '';

            data.shops.forEach(shop => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="shop-name">${shop.name}</div>
                    <div class="info-row">
                        <span class="label">Накладная:</span>
                        <span>№${shop.invoice}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Сумма:</span>
                        <span style="font-weight:bold">${shop.amount} сом</span>
                    </div>
                    <button class="btn-go" onclick="openMap('${shop.coords}')">📍 В ПУТЬ</button>
                `;
                container.appendChild(card);
            });
        } catch (error) {
            document.getElementById('loader').innerText = "Ошибка загрузки данных.";
            console.error(error);
        }
    }

    function openMap(coords) {
        if(!coords || coords === "0,0") {
            alert("Координаты не заданы");
            return;
        }
        const url = `https://www.google.com/maps/search/?api=1&query=${coords}`;
        window.open(url, '_blank');
    }

    loadData();
</script>

</body>
</html>
