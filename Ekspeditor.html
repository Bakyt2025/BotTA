<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Экспедитор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 10px; margin: 0; color: #333; }
        .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .name { font-weight: bold; font-size: 16px; color: #1c1c1c; margin-bottom: 8px; line-height: 1.2; }
        .row { display: flex; justify-content: space-between; font-size: 14px; margin: 3px 0; color: #555; }
        .btn-go { display: block; background: #31b545; color: #fff; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; margin-top: 10px; font-weight: bold; }
        .header { text-align: center; padding: 10px 0; border-bottom: 1px solid #ddd; margin-bottom: 15px; }
        .status { font-size: 12px; color: #888; margin-top: 5px; }
        #loader { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <b id="date">Загрузка...</b>
        <div id="update-time" class="status"></div>
    </div>
    
    <div id="loader">Синхронизация с GitHub...</div>
    <div id="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function loadData() {
            // ВАЖНО: Имя файла должно совпадать с GH_FILE_PATH в Python (expeditor.json)
            const url = `https://raw.githubusercontent.com/Bakyt2025/BotTA/main/expeditor.json?v=${Date.now()}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Файл expeditor.json не найден. Нажмите 'Обновить данные' в боте.");
                
                const data = await response.json();
                
                // Проверка на пустые данные
                if (!data.shops || data.shops.length === 0) {
                    throw new Error("В файле нет данных о магазинах.");
                }

                document.getElementById('loader').style.display = 'none';
                document.getElementById('date').innerText = data.date;
                document.getElementById('update-time').innerText = "Обновлено: " + data.updated;
                
                const listDiv = document.getElementById('list');
                listDiv.innerHTML = '';

                data.shops.forEach(shop => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="name">${shop.name}</div>
                        <div class="row"><span>Накладная:</span> <b>${shop.invoice}</b></div>
                        <div class="row"><span>Сумма:</span> <b style="color: #2e7d32;">${shop.amount} сом</b></div>
                        <a class="btn-go" href="https://www.google.com/maps/search/?api=1&query=${shop.coords}">📍 В ПУТЬ</a>
                    `;
                    listDiv.appendChild(card);
                });
            } catch (err) {
                document.getElementById('loader').innerHTML = `<b style="color:red">${err.message}</b>`;
                document.getElementById('date').innerText = "Ошибка";
            }
        }

        loadData();
    </script>
</body>
</html>
