<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Экспедитор PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #f0f2f5;
            --main-color: #000000;
            --accent-color: #007AFF;
            --success-color: #28a745;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: #000;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* Шапка */
        header {
            padding: 25px 20px;
            background: #fff;
            border-bottom: 2px solid var(--main-color);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h2 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
        header p { margin: 5px 0 0; font-size: 12px; font-weight: 600; opacity: 0.6; }

        /* Поиск */
        .search-container {
            padding: 15px;
            background: var(--tg-theme-bg-color);
        }

        .search-bar {
            background: #fff;
            border: 2px solid var(--main-color);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .search-bar input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            margin-left: 10px;
        }

        /* Статистика */
        .stats {
            display: flex;
            justify-content: space-between;
            padding: 0 15px 10px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Список */
        #shop-list { padding: 0 15px 120px; }

        .card {
            background: #fff;
            border: 2px solid var(--main-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            position: relative;
            transition: transform 0.1s;
        }

        .card:active { transform: scale(0.98); }

        .card-name {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 12px;
            display: block;
            line-height: 1.2;
        }

        .card-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px dashed #ccc;
            padding-top: 12px;
        }

        .invoice-box { display: flex; flex-direction: column; }
        .label { font-size: 11px; font-weight: 700; opacity: 0.5; margin-bottom: 2px; }
        .invoice-num { font-size: 15px; font-weight: 800; }
        .amount { font-size: 22px; font-weight: 900; color: var(--success-color); }

        .btn-map {
            background: var(--accent-color);
            color: #fff;
            border: 2px solid var(--main-color);
            border-radius: 10px;
            padding: 10px 15px;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Состояния */
        #loader { text-align: center; padding: 50px; font-weight: 900; }
        .error-box { color: red; text-align: center; padding: 20px; font-weight: 800; }
    </style>
</head>
<body>

<header>
    <h2 id="sheet-date">ЗАГРУЗКА...</h2>
    <p id="last-updated"></p>
</header>

<div class="search-container">
    <div class="search-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search" placeholder="ПОИСК..." oninput="filterShops()">
    </div>
</div>

<div class="stats">
    <span id="count-shops">Точек: 0</span>
    <span id="total-sum">Сумма: 0</span>
</div>

<div id="loader">ПОДОЖДИТЕ, СВЯЗЬ С ОБЛАКОМ...</div>
<div id="shop-list"></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    let allShops = [];

    // Форматирование чисел (10500 -> 10 500)
    const formatNum = (num) => String(num).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

    async function loadData() {
        // Используем GitHub Pages URL (он стабильнее) + Cache Buster
        const url = `https://bakyt2025.github.io/BotTA/expeditor.json?nocache=${Date.now()}`;
        
        try {
            const response = await fetch(url);
            
            if (!response.ok) {
                if (response.status === 404) throw new Error("Файл данных еще не создан ботом");
                throw new Error(`Ошибка сервера: ${response.status}`);
            }

            const data = await response.json();
            
            if (!data.shops || !Array.isArray(data.shops)) {
                throw new Error("Неверный формат данных (список пуст)");
            }

            allShops = data.shops;
            document.getElementById('loader').style.display = 'none';
            document.getElementById('sheet-date').innerText = data.date || "МАРШРУТ";
            document.getElementById('last-updated').innerText = `Обновлено в ${data.updated || '--:--'}`;
            
            render(allShops);
        } catch (e) {
            console.error(e);
            document.getElementById('loader').innerHTML = `
                <div class="error-box">
                    ⚠️ ОШИБКА ЗАГРУЗКИ<br>
                    <small style="font-size: 12px; font-weight: normal; opacity: 0.7;">${e.message}</small><br><br>
                    <button onclick="location.reload()" style="padding: 10px; border-radius: 8px; border: 1px solid black; font-weight: bold;">ПОПРОБОВАТЬ СНОВА</button>
                </div>`;
        }
    }

    function render(shops) {
        const container = document.getElementById('shop-list');
        container.innerHTML = '';
        
        let total = 0;

        shops.forEach(shop => {
            const sum = parseFloat(String(shop.amount).replace(/[^0-9.]/g, '')) || 0;
            total += sum;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-name">${shop.name}</div>
                <div class="card-info">
                    <div class="invoice-box">
                        <span class="label">НАКЛАДНАЯ</span>
                        <span class="invoice-num">№${shop.invoice}</span>
                        <span class="amount">${formatNum(shop.amount)} <small style="font-size:12px">СОМ</small></span>
                    </div>
                    <button class="btn-map" onclick="openMap('${shop.coords}', '${shop.name}')">
                        📍 КАРТА
                    </button>
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById('count-shops').innerText = `Точек: ${shops.length}`;
        document.getElementById('total-sum').innerText = `Сумма: ${formatNum(total)}`;
    }

    function filterShops() {
        const q = document.getElementById('search').value.toLowerCase();
        const filtered = allShops.filter(s => 
            s.name.toLowerCase().includes(q) || 
            s.invoice.toLowerCase().includes(q)
        );
        render(filtered);
    }

    function openMap(coords, name) {
        tg.HapticFeedback.impactOccurred('medium');
        if (!coords || coords === "0,0" || coords.trim() === "") {
            return tg.showAlert("❌ Координаты не указаны для этого магазина");
        }
        
        // Ссылка работает и для Google, и для Яндекс.Навигатора
        const url = `https://www.google.com/maps/search/?api=1&query=${coords.trim()}`;
        tg.openLink(url);
    }

    loadData();
</script>

</body>
</html>
