<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Экспедитор PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #f0f2f5;
            --main-color: #000000;
            --accent-color: #007AFF;
            --success-color: #28a745;
            --disabled-color: #c4c4c4;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: #000;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Шапка */
        header {
            padding: 25px 20px;
            background: #fff;
            border-bottom: 2px solid var(--main-color);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h2 { margin: 0; font-size: 20px; font-weight: 900; text-transform: uppercase; }
        header p { margin: 5px 0 0; font-size: 12px; font-weight: 600; opacity: 0.6; }

        /* Поиск */
        .search-container {
            padding: 15px;
            background: var(--tg-theme-bg-color);
        }

        .search-bar {
            background: #fff;
            border: 2px solid var(--main-color);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .search-bar input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            margin-left: 10px;
        }

        /* Статистика */
        .stats {
            display: flex;
            justify-content: space-between;
            padding: 0 18px 10px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            color: #444;
        }

        /* Список карточек */
        #shop-list { padding: 0 15px 120px; }

        .card {
            background: #fff;
            border: 2px solid var(--main-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 2px 0 var(--main-color);
        }

        .card-name {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 12px;
            display: block;
            line-height: 1.2;
            color: var(--main-color);
        }

        .card-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px dashed #ccc;
            padding-top: 12px;
        }

        .invoice-box { display: flex; flex-direction: column; }
        .label { font-size: 10px; font-weight: 800; opacity: 0.5; margin-bottom: 2px; text-transform: uppercase; }
        .invoice-num { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
        .amount { font-size: 22px; font-weight: 900; color: var(--success-color); }

        /* Кнопка КАРТА */
        .btn-map {
            background: var(--accent-color);
            color: #fff;
            border: 2px solid var(--main-color);
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 800;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.1s;
        }

        .btn-map:active { transform: scale(0.95); background: #000; color: #fff; }

        /* Состояние для неактивной кнопки */
        .btn-map:disabled {
            background-color: var(--disabled-color) !important;
            border-color: #888 !important;
            color: #666 !important;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Загрузка и ошибки */
        #loader { text-align: center; padding: 50px; font-weight: 900; }
        .error-box { color: red; text-align: center; padding: 20px; font-weight: 800; }
    </style>
</head>
<body>

<header>
    <h2 id="sheet-date">ЗАГРУЗКА ДАННЫХ...</h2>
    <p id="last-updated"></p>
</header>

<div class="search-container">
    <div class="search-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search" placeholder="ПОИСК МАГАЗИНА..." oninput="filterShops()">
    </div>
</div>

<div class="stats">
    <span id="count-shops">ТОЧЕК: 0</span>
    <span id="total-sum">ИТОГО: 0 СОМ</span>
</div>

<div id="loader">ПОЖАЛУЙСТА, ПОДОЖДИТЕ...</div>
<div id="shop-list"></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    let allShops = [];

    // Красивое разделение тысяч (15000 -> 15 000)
    const formatNum = (num) => String(num).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

    async function loadData() {
        // Ссылка с защитой от кэширования
        const url = `https://bakyt2025.github.io/BotTA/expeditor.json?v=${Date.now()}`;
        
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Ошибка: ${response.status}`);

            const data = await response.json();
            allShops = data.shops || [];
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('sheet-date').innerText = data.date || "МАРШРУТНЫЙ ЛИСТ";
            document.getElementById('last-updated').innerText = `ОБНОВЛЕНО В ${data.updated || '--:--'}`;
            
            render(allShops);
        } catch (e) {
            document.getElementById('loader').innerHTML = `
                <div class="error-box">
                    ⚠️ ОШИБКА ДОСТУПА<br>
                    <small style="font-weight:normal">ОБНОВИТЕ ДАННЫЕ В БОТЕ И ПОДОЖДИТЕ 1 МИНУТУ</small><br><br>
                    <button onclick="location.reload()" style="padding:10px 20px; border-radius:8px; border:2px solid black; font-weight:bold">ПОВТОРИТЬ</button>
                </div>`;
        }
    }

    function render(shops) {
        const container = document.getElementById('shop-list');
        container.innerHTML = '';
        
        let total = 0;

        shops.forEach(shop => {
            // Очищаем сумму от лишних знаков и считаем итог
            const sumValue = parseFloat(String(shop.amount).replace(/[^0-9.]/g, '')) || 0;
            total += sumValue;

            // ПРОВЕРКА КООРДИНАТ
            const hasCoords = shop.coords && shop.coords !== "0,0" && shop.coords.trim() !== "" && shop.coords.includes(',');

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-name">${shop.name}</div>
                <div class="card-info">
                    <div class="invoice-box">
                        <span class="label">ДОКУМЕНТ</span>
                        <span class="invoice-num">№${shop.invoice}</span>
                        <span class="amount">${formatNum(shop.amount)} <small style="font-size:12px">СОМ</small></span>
                    </div>
                    <button class="btn-map" 
                        onclick="openMap('${shop.coords}')" 
                        ${hasCoords ? '' : 'disabled'}>
                        ${hasCoords ? '📍 КАРТА' : 'НЕТ КООРД.'}
                    </button>
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById('count-shops').innerText = `ТОЧЕК: ${shops.length}`;
        document.getElementById('total-sum').innerText = `ИТОГО: ${formatNum(total)} СОМ`;
    }

    function filterShops() {
        const q = document.getElementById('search').value.toLowerCase();
        const filtered = allShops.filter(s => 
            s.name.toLowerCase().includes(q) || 
            s.invoice.toLowerCase().includes(q)
        );
        render(filtered);
    }

    function openMap(coords) {
        tg.HapticFeedback.impactOccurred('medium'); // Вибрация при нажатии
        
        if (!coords || coords === "0,0") return;

        // Ссылка открывает навигатор (Google или Яндекс)
        const url = `https://www.google.com/maps/search/?api=1&query=${coords.trim()}`;
        tg.openLink(url);
    }

    loadData();
</script>

</body>
</html>
