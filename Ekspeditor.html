<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маршрут Экспедитора</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 15px; margin: 0; }
        .header { text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 1.2em; }
        .card { 
            background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 6px solid #0088cc;
        }
        .shop-name { font-size: 1.1em; font-weight: bold; color: #0088cc; margin-bottom: 8px; }
        .info { font-size: 0.9em; color: #555; margin: 4px 0; }
        .amount { color: #d32f2f; font-weight: bold; }
        .btn-map { 
            display: block; text-align: center; background: #34a853; color: white; 
            text-decoration: none; padding: 12px; border-radius: 8px; margin-top: 10px; font-weight: bold; 
        }
    </style>
</head>
<body>
    <div id="date-header" class="header">Загрузка данных...</div>
    <div id="list"></div>

    <script>
        // Добавляем случайный параметр, чтобы избежать кэширования GitHub
        const jsonUrl = 'https://raw.githubusercontent.com/Bakyt2025/BotTA/main/expeditor_route.json?nocache=' + Math.random();

        fetch(jsonUrl)
            .then(response => response.json())
            .then(data => {
                document.getElementById('date-header').innerText = data.date;
                const container = document.getElementById('list');
                
                data.shops.forEach(shop => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="shop-name">${shop.name}</div>
                        <div class="info">🧾 Накладная: <b>${shop.invoice}</b></div>
                        <div class="info">💰 Сумма: <span class="amount">${shop.amount}</span></div>
                        <a class="btn-map" href="https://www.google.com/maps/search/?api=1&query=${shop.coords}">📍 В ПУТЬ (Карта)</a>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('date-header').innerText = "Ошибка загрузки маршрута";
                console.error(err);
            });
    </script>
</body>
</html>
