<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экспедитор PRO</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
               background-color: #efeff4; margin: 0; padding: 10px; color: #333; }
        .header { text-align: center; font-weight: bold; margin: 10px 0 20px; font-size: 1.2em; color: #000; }
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 12px; 
                box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: #007aff; }
        .shop-name { font-size: 17px; font-weight: 700; margin-bottom: 8px; display: block; }
        .row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 14px; }
        .label { color: #8e8e93; }
        .val { font-weight: 500; }
        .btn-map { display: block; text-align: center; background: #34c759; color: white; 
                   text-decoration: none; padding: 12px; border-radius: 10px; margin-top: 10px; 
                   font-weight: 600; font-size: 15px; transition: background 0.2s; }
        .btn-map:active { background: #28a745; }
        .sum { color: #ff3b30; font-weight: bold; }
    </style>
</head>
<body>
    <div id="date-header" class="header">Маршрут</div>
    <div id="list"></div>

    <script>
        try {
            // 1. Получаем данные из URL
            const urlParams = new URLSearchParams(window.location.search);
            const rawData = urlParams.get('data');
            
            if (rawData) {
                // 2. Декодируем Base64 и парсим JSON
                const decodedData = JSON.parse(decodeURIComponent(escape(atob(rawData))));
                
                document.getElementById('date-header').innerText = decodedData.d;
                const container = document.getElementById('list');
                
                decodedData.sh.forEach((shop, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <span class="shop-name">${index + 1}. ${shop.n}</span>
                        <div class="row">
                            <span class="label">🧾 Накладная:</span>
                            <span class="val">${shop.i}</span>
                        </div>
                        <div class="row">
                            <span class="label">💰 Сумма:</span>
                            <span class="val sum">${shop.s}</span>
                        </div>
                        <a class="btn-map" href="https://www.google.com/maps/search/?api=1&query=${shop.c}">📍 Проложить маршрут</a>
                    `;
                    container.appendChild(card);
                });
            } else {
                document.getElementById('list').innerHTML = "<p style='text-align:center'>Данные не переданы</p>";
            }
        } catch (e) {
            document.getElementById('list').innerHTML = "<p>Ошибка загрузки данных</p>";
            console.error(e);
        }
    </script>
</body>
</html>
