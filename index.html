<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ товаров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: rgba(0, 0, 0, 0.06);
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --accent: #0071e3;
            --accent-soft: rgba(0, 113, 227, 0.12);
            --danger: #ff3b30;
            --danger-soft: rgba(255, 59, 48, 0.12);
            --success: #34c759;
            --success-soft: rgba(52, 199, 89, 0.15);
            --radius: 16px;
            --radius-sm: 12px;
            --radius-pill: 999px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --glass-bg: rgba(44, 44, 46, 0.72);
                --glass-border: rgba(255, 255, 255, 0.08);
                --glass-shadow: rgba(0, 0, 0, 0.3);
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --accent: #0a84ff;
                --accent-soft: rgba(10, 132, 255, 0.2);
            }
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #f5f5f7);
            color: var(--tg-theme-text-color, var(--text-primary));
            margin: 0;
            padding: 0;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .page-header {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 16px 20px 20px;
            padding-top: calc(12px + env(safe-area-inset-top, 0));
            background: var(--glass-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 1px 0 var(--glass-shadow);
        }
        .page-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            text-align: center;
            color: inherit;
        }
        #catalog {
            padding: 12px 16px 120px;
        }
        .item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 14px 16px;
            gap: 14px;
            background: var(--glass-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: 0 2px 8px var(--glass-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .item:active {
            transform: scale(0.99);
        }
        .info {
            flex: 1;
            min-width: 0;
        }
        .name {
            font-weight: 500;
            font-size: 15px;
            line-height: 1.35;
            margin-bottom: 4px;
            color: inherit;
        }
        .price {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent);
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        button.btn-ctrl {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: var(--radius-pill);
            color: white;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        button.btn-ctrl:active {
            transform: scale(0.92);
        }
        .btn-clear {
            background: var(--text-secondary);
            font-size: 16px;
            opacity: 0.9;
        }
        .btn-minus {
            background: var(--danger);
            box-shadow: 0 2px 8px rgba(255, 59, 48, 0.35);
        }
        .btn-plus1 {
            background: var(--accent);
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.35);
        }
        .btn-plus10 {
            background: var(--success);
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.35);
            font-size: 15px;
        }
        .count {
            font-weight: 600;
            min-width: 28px;
            text-align: center;
            font-size: 17px;
            color: inherit;
        }
        #send-btn {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0));
            left: 16px;
            right: 16px;
            padding: 16px 24px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: none;
            box-shadow: 0 4px 20px rgba(52, 199, 89, 0.4);
            z-index: 100;
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        #send-btn:active {
            transform: scale(0.98);
        }

        /* === ГРУППЫ — 3 строки по 3 кнопки === */
        #group-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px 16px;
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 1px 0 var(--glass-shadow);
        }
        .group-tab {
            padding: 12px 8px;
            border-radius: var(--radius-pill);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--glass-shadow);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .group-tab:active {
            transform: scale(0.95);
        }
        .group-tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.4);
        }
    </style>
</head>
<body>
    <header class="page-header">
        <h2>Выберите товары</h2>
    </header>
    <div id="group-tabs"></div>
    <div id="catalog"></div>
    <button id="send-btn">Оформить заказ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

const products = [
    { name: 'Газированная вода "EVITA" 1,5л', price: 38.00 },

    { name: 'Квас Деревенский 0,9 л', price: 46.00 },
    { name: 'Квас Деревенский 2,9 л', price: 110.00 },
    { name: 'Лимонад Bazaleti Гранат 0,5л', price: 55.00 },
    { name: 'Лимонад Bazaleti Гранат 1л', price: 92.00 },

    { name: 'Лимонад Дюшес 0,9 л', price: 46.00 },
    { name: 'Лимонад Дюшес 2,9л', price: 115.00 },
    { name: 'Минеральная вода (без газ) 0,33л', price: 17.00 },
    { name: 'Минеральная вода (без газ) 0,5л', price: 22.00 },

    { name: 'Минеральная вода (без газ) 1л', price: 33.00 },
    { name: 'Напиток газ. TUMAR Буратино 2.0л', price: 88.00 },

    { name: 'Напиток газ. TUMAR Мохито 2.0л', price: 88.00 },

    { name: 'Напиток газированный АНАР деревенский 0,9 л', price: 46.00 },

    { name: 'Напиток негаз. Frutik Bubble gum 0.5л', price: 41.00 },

    { name: 'Напиток негаз. Кувшин Абрикос 1.8л', price: 88.00 },
    { name: 'Напиток негаз. Кувшин Гранат-Ежевика 1.8л', price: 88.00 },

    { name: 'Напиток негаз. ОК Абрикос 0.2л', price: 41.00 },

    { name: 'Напиток негаз. ОК Мультифрукт 0.2л', price: 41.00 },
    { name: 'Напиток негаз. ОК Мультифрукт 0.93л', price: 99.00 },
    { name: 'Напиток негаз. ОК Персик 0.2л', price: 41.00 },
    { name: 'Напиток негаз. ОК Персик 0.93л', price: 99.00 },
    { name: 'Напиток негаз. ОК Яблоко 0.2л', price: 41.00 },
    { name: 'Напиток негаз. ОК Яблоко 0.93л', price: 99.00 },
    { name: 'Напиток сокосодержащий "Melon juice" дыня 1 л', price: 96.00 },
    { name: 'Напиток сокосодержащий "Pomegranate juice" гранат 1л', price: 96.00 },
    { name: 'Напиток сокосодержащий GULLUG Черная смородина 1,0', price: 96.00 },
    { name: 'Негазированная вода "EVITA" SPORT 0.75л', price: 42.00 },
    { name: 'Огурцы консервированные корнишоны 3л ст/б', price: 295.00 },
    { name: 'Сок Деревенский Вишня 4,9л', price: 130.00 },
    { name: 'Сок Деревенский Гранат 4,9л', price: 130.00 },
    { name: 'Сок Деревенский Мультик 4,9л', price: 130.00 },
    { name: 'Сокосодержащий напиток"Blackcurrant juice" черная смородина 0,5 л', price: 60.00 },
    { name: 'Сокосодержащий напиток " Cantaloupe juice" канталупа 0,5 л', price: 60.00 },
    { name: 'Сокосодержащий напиток "Cantoloupe juice" со вкусом канталупа, 1 л', price: 96.00 },
    { name: 'Сокосодержащий напиток "Melon juice" дыня 0,5 л', price: 60.00 },
    { name: 'Сокосодержащий напиток "Pomegranate juice" гранат 0.5 л', price: 60.00 }
];
       
        let cart = {}; // name → количество
        const catalogDiv = document.getElementById('catalog');
let currentGroup = 'Все';
const groupNames = ['Все', 'Вода', 'Квас', 'Лимонады', 'Энергетики', 'Газ. напитки', 'Негаз. напитки', 'Соки', 'Консервы'];

function renderCatalog() {
  catalogDiv.innerHTML = '';
  products.forEach((p, index) => {
    if (currentGroup !== 'Все') {
      const n = p.name.toLowerCase();
      let belongs = false;
      if (currentGroup === 'Вода') belongs = n.includes('вода') || n.includes('evita') || n.includes('минеральная');
      else if (currentGroup === 'Квас') belongs = n.includes('квас');
      else if (currentGroup === 'Лимонады') belongs = n.includes('лимон');
      else if (currentGroup === 'Энергетики') belongs = n.includes('khabib') || n.includes('энергетик');
      else if (currentGroup === 'Газ. напитки') belongs = n.includes('напиток газ');
      else if (currentGroup === 'Негаз. напитки') belongs = n.includes('напиток негаз') || n.includes('frutik') || n.includes('кувшин') || n.includes('ок ');
      else if (currentGroup === 'Соки') belongs = n.includes('сок') || n.includes('сокосодержащий');
      else if (currentGroup === 'Консервы') belongs = n.includes('огурцы');
      if (!belongs) return;
    }
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="price">${p.price} сом</div>
      </div>
      <div class="controls">
        <button class="btn-ctrl btn-clear" onclick="setQty(${index}, 0)">x</button>
        <button class="btn-ctrl btn-minus" onclick="changeQty(${index}, -1)">−</button>
        <span class="count" id="count-${index}">${cart[p.name] || 0}</span>
        <button class="btn-ctrl btn-plus1" onclick="changeQty(${index}, 1)">+</button>
        <button class="btn-ctrl btn-plus10" onclick="changeQty(${index}, 10)">+</button>
      </div>
    `;
    catalogDiv.appendChild(div);
  });
}

        function changeQty(index, delta) {
            const p = products[index];
            const name = p.name;
            cart[name] = (cart[name] || 0) + delta;
            if (cart[name] < 0) cart[name] = 0;
            const countEl = document.getElementById(`count-${index}`);
            if (countEl) countEl.innerText = cart[name];
            updateSendButton();
        }
        function setQty(index, value) {
            const p = products[index];
            const name = p.name;
            cart[name] = value;
            const countEl = document.getElementById(`count-${index}`);
            if (countEl) countEl.innerText = cart[name];
            updateSendButton();
        }
        function updateSendButton() {
            const hasItems = Object.values(cart).some(q => q > 0);
            const sendBtn = document.getElementById('send-btn');
            sendBtn.style.display = hasItems ? 'block' : 'none';
            if (hasItems) {
                let total = 0;
                products.forEach(p => {
                    const qty = cart[p.name] || 0;
                    if (qty > 0) total += qty * p.price;
                });
                sendBtn.innerText = `Заказать на ${Math.round(total)} сом`;
            }
        }
        document.getElementById('send-btn').addEventListener('click', () => {
            let orderItems = [];
            for (let name in cart) {
                if (cart[name] > 0) {
                    orderItems.push({ name: name, quantity: cart[name] });
                }
            }
            if (orderItems.length === 0) return;
            tg.sendData(JSON.stringify({ items: orderItems }));
            tg.close();
        });

const tabsDiv = document.getElementById('group-tabs');
groupNames.forEach((g) => {
  const btn = document.createElement('button');
  btn.textContent = g;
  btn.className = `group-tab${g === currentGroup ? ' active' : ''}`;
  btn.onclick = () => {
    currentGroup = g;
    document.querySelectorAll('.group-tab').forEach(b => b.classList.toggle('active', b.textContent === g));
    renderCatalog();
  };
  tabsDiv.appendChild(btn);
});
renderCatalog();
    </script>
</body>
</html>
