<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заказ БК</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --accent: #34c759; --danger: #ff3b30; }
        body { font-family: -apple-system, sans-serif; background: #fff; margin: 0; padding-bottom: 100px; color: #1c1c1e; }
        .header { background: #e5f1f6; padding: 12px 15px; font-weight: 600; position: sticky; top:0; z-index:10; border-bottom:1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .search-box { padding: 10px 15px; }
        .search { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #f2f2f7; outline: none; box-sizing: border-box; font-size: 16px; }
        .item { display: flex; flex-direction: column; padding: 15px; border-bottom: 1px solid #f2f2f7; }
        
        /* Улучшенная раскладка для мобильных */
        .item-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .p-info { flex: 1; margin-right: 10px; }
        .p-name { font-weight: 500; font-size: 15px; margin-bottom: 4px; }
        .p-price { color: #007aff; font-weight: bold; font-size: 14px; }
        .p-stock { font-size: 12px; color: #8e8e93; display: block; margin-top: 2px; }
        .low { color: var(--danger); font-weight: bold; }
        
        /* Контейнер кнопок */
        .controls { display: flex; align-items: center; gap: 6px; }
        .btn { 
            min-width: 36px; height: 36px; padding: 0 5px;
            border-radius: 8px; border: none; background: #e9e9eb; 
            font-size: 16px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; user-select: none; 
        }
        .btn-plus { background: var(--accent); color: white; }
        .btn-minus-10 { background: #ff9500; color: white; } /* Оранжевый для -10 */
        .btn-plus-10 { background: #007aff; color: white; }  /* Синий для +10 */
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .q { min-width: 30px; text-align: center; font-weight: bold; font-size: 18px; }
        
        .footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: white; border-top: 1px solid #eee; display: none; z-index: 20; }
        .btn-send { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: 600; box-shadow: 0 4px 10px rgba(52, 199, 89, 0.3); }
    </style>
</head>
<body>
    <div class="header">
        <span id="c-name">Загрузка...</span>
        <a href="KontragentyBK.html" style="color:#007aff; text-decoration:none; font-weight:400; font-size: 14px;">Назад</a>
    </div>
    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 Поиск товара..." class="search">
    </div>
    <div id="catalog"></div>
    <div id="footer" class="footer">
        <button class="btn-send" onclick="send()">Оформить: <span id="total">0</span> сом</button>
    </div>

<script>
    let tg = window.Telegram.WebApp; 
    let p_list = []; 
    let cart = {};
    
    const params = new URLSearchParams(window.location.search);
    let client = params.has('name') ? {name: params.get('name'), currentCoords: params.get('geo')||"0,0"} : JSON.parse(localStorage.getItem('selectedClient'));

    if (!client) {
        location.href = 'KontragentyBK.html';
    } else {
        document.getElementById('c-name').innerText = (client.currentCoords && client.currentCoords !== "0,0" ? "📍 " : "🏘 ") + client.name;
    }

    async function load() {
        try {
            const r = await fetch('databk.json?v=' + Date.now());
            const d = await r.json(); 
            p_list = d.products || []; 
            render();
        } catch (e) { 
            document.getElementById('catalog').innerHTML = '<div style="padding:20px; text-align:center;">Ошибка загрузки данных databk.json</div>'; 
        }
    }

    function render() {
        const t = document.getElementById('search').value.toLowerCase();
        const cont = document.getElementById('catalog'); 
        cont.innerHTML = '';
        
        p_list.forEach((p, idx) => {
            if (p.name.toLowerCase().includes(t)) {
                const curQty = cart[p.name] ? cart[p.name].qty : 0;
                const div = document.createElement('div'); 
                div.className = 'item';
                div.innerHTML = `
                    <div class="item-row">
                        <div class="p-info">
                            <div class="p-name">${p.name}</div>
                            <span class="p-price">${p.price} сом</span>
                            <span class="p-stock ${p.stock < 10 ? 'low' : ''}">Остаток: ${p.stock}</span>
                        </div>
                        <div class="controls">
                            <button class="btn btn-minus-10" onclick="upd(${idx},-10)">-10</button>
                            <button class="btn" onclick="upd(${idx},-1)">-</button>
                            <span class="q" id="q-${idx}">${curQty}</span>
                            <button class="btn btn-plus" id="bp-${idx}" ${curQty >= p.stock ? 'disabled' : ''} onclick="upd(${idx},1)">+</button>
                            <button class="btn btn-plus-10" id="bp10-${idx}" ${curQty >= p.stock ? 'disabled' : ''} onclick="upd(${idx},10)">+10</button>
                        </div>
                    </div>`;
                cont.appendChild(div);
            }
        });
    }

    window.upd = function(idx, delta) {
        const p = p_list[idx];
        if (!cart[p.name]) cart[p.name] = { qty: 0, price: p.price };
        
        let newQty = cart[p.name].qty + delta;
        
        // Ограничения: не меньше 0 и не больше остатка
        if (newQty < 0) newQty = 0;
        if (newQty > p.stock) newQty = p.stock;
        
        cart[p.name].qty = newQty;
        
        if (cart[p.name].qty <= 0) {
            delete cart[p.name];
        }
        
        // Обновляем UI
        let el = document.getElementById('q-' + idx); 
        let bPlus = document.getElementById('bp-' + idx);
        let bPlus10 = document.getElementById('bp10-' + idx);
        let cur = cart[p.name] ? cart[p.name].qty : 0;
        
        if (el) el.innerText = cur; 
        if (bPlus) bPlus.disabled = (cur >= p.stock);
        if (bPlus10) bPlus10.disabled = (cur >= p.stock);
        
        // Считаем общую сумму
        let sum = 0; 
        for (let n in cart) sum += cart[n].qty * cart[n].price;
        
        document.getElementById('footer').style.display = sum > 0 ? 'block' : 'none';
        document.getElementById('total').innerText = Math.round(sum);
    }

    window.send = function() {
        if (Object.keys(cart).length === 0) return;
        const orderData = { 
            client: client, 
            items: cart, 
            total: document.getElementById('total').innerText, 
            coords: client.currentCoords || "0,0" 
        };
        tg.sendData(JSON.stringify(orderData));
        tg.close();
    }

    document.getElementById('search').oninput = render; 
    load();
</script>
</body>
</html>
