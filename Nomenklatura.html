<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Товары</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --accent: #34c759; }
        body { font-family: -apple-system, sans-serif; background: #fff; margin: 0; padding-bottom: 100px; }
        .header { background: #e5f1f6; padding: 12px 15px; font-weight: 600; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; }
        .search-box { padding: 10px 15px; }
        .search { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #f2f2f7; outline: none; box-sizing: border-box; font-size: 16px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #f2f2f7; }
        .controls { display: flex; align-items: center; gap: 15px; }
        .btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #e9e9eb; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-plus { background: var(--accent); color: white; }
        .q { min-width: 24px; text-align: center; font-weight: bold; font-size: 18px; }
        .footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: white; border-top: 1px solid #eee; display: none; }
        .btn-send { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header"><span id="c-name">Загрузка...</span><a href="Kontragenty.html" style="color:#007aff; text-decoration:none;">Назад</a></div>
    <div class="search-box"><input type="text" id="search" placeholder="🔍 Поиск товара..." class="search"></div>
    <div id="catalog"><p style="text-align:center; padding:20px; color:#888;">Загрузка товаров...</p></div>
    <div id="footer" class="footer"><button class="btn-send" onclick="send()">Заказать: <span id="total">0</span> сом</button></div>

<script>
    let tg = window.Telegram.WebApp;
    let products = []; let cart = {};
    const params = new URLSearchParams(window.location.search);
    let client = params.has('name') ? {name: params.get('name')} : JSON.parse(localStorage.getItem('selectedClient'));

    if (!client) { location.href = 'Kontragenty.html'; } 
    else { document.getElementById('c-name').innerText = client.name; }

    async function load() {
        try {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            products = d.products || [];
            render();
        } catch (e) {
            document.getElementById('catalog').innerHTML = '<p style="color:red; text-align:center;">Ошибка загрузки data.json</p>';
        }
    }

    function render() {
        const t = document.getElementById('search').value.toLowerCase();
        const cont = document.getElementById('catalog');
        cont.innerHTML = '';
        
        let found = 0;
        products.forEach((p, idx) => {
            if (p.name.toLowerCase().includes(t)) {
                found++;
                const d = document.createElement('div');
                d.className = 'item';
                d.innerHTML = `<div><b>${p.name}</b><br>${p.price} сом</div>
                    <div class="controls">
                        <button class="btn" onclick="upd(${idx}, -1)">-</button>
                        <span class="q" id="q-${idx}">${cart[p.name] || 0}</span>
                        <button class="btn btn-plus" onclick="upd(${idx}, 1)">+</button>
                    </div>`;
                cont.appendChild(d);
            }
        });
        if(found === 0 && products.length > 0) cont.innerHTML = '<p style="text-align:center; padding:20px;">Ничего не найдено</p>';
    }

    window.upd = function(idx, delta) {
        const p = products[idx];
        if (!cart[p.name]) cart[p.name] = 0;
        cart[p.name] += delta;
        if (cart[p.name] <= 0) delete cart[p.name];
        
        const el = document.getElementById('q-' + idx);
        if (el) el.innerText = cart[p.name] || 0;
        
        let sum = 0;
        for (let name in cart) {
            let item = products.find(x => x.name === name);
            if (item) sum += cart[name] * item.price;
        }
        document.getElementById('footer').style.display = sum > 0 ? 'block' : 'none';
        document.getElementById('total').innerText = Math.round(sum);
    };

    window.send = function() {
        if (Object.keys(cart).length === 0) return;
        tg.sendData(JSON.stringify({client: client, items: cart, total: document.getElementById('total').innerText}));
        tg.close();
    }

    document.getElementById('search').oninput = render;
    load();
    // Страховка: если через 1.5 сек список пуст, пробуем еще раз
    setTimeout(() => { if (products.length === 0) load(); }, 1500);
</script>
</body>
</html>
