<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --item-bg: #f9f9fb;
            --accent: #34c759; /* Зеленый для товаров */
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .header { padding: 15px; border-bottom: 1px solid #eee; position: sticky; top: 0; background: white; z-index: 10; }
        .client-header { background: #e5f1f6; padding: 10px 15px; font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; }
        .search-container { padding: 10px 15px; }
        .search { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #eee; background: #f2f2f7; outline: none; }
        
        .product-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border-bottom: 1px solid #f2f2f7;
        }
        .p-name { font-weight: 500; font-size: 15px; margin-bottom: 4px; }
        .p-price { color: #007aff; font-weight: bold; }
        .p-stock { font-size: 12px; color: #8e8e93; }

        .controls { display: flex; align-items: center; gap: 12px; }
        .btn { 
            width: 32px; height: 32px; border-radius: 50%; border: none; 
            background: #e9e9eb; font-size: 20px; cursor: pointer; 
        }
        .btn-plus { background: var(--accent); color: white; }
        .count { font-weight: 600; min-width: 20px; text-align: center; }

        .footer { 
            position: fixed; bottom: 0; left: 0; right: 0; padding: 20px; 
            background: white; border-top: 1px solid #eee; display: none;
        }
        .btn-order { 
            width: 100%; padding: 16px; background: var(--accent); color: white; 
            border: none; border-radius: 14px; font-size: 17px; font-weight: 600; 
        }
    </style>
</head>
<body>

<div class="client-header">
    <span id="client-name">Загрузка клиента...</span>
    <a href="Kontragenty.html" style="color: #007aff; text-decoration: none;">Сменить</a>
</div>

<div class="search-container">
    <input type="text" id="search" class="search" placeholder="Поиск товара...">
</div>

<div id="catalog"></div>

<div id="footer" class="footer">
    <button class="btn-order" onclick="sendOrder()">Оформить на <span id="total-sum">0</span> сом</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    let products = [];
    let cart = {};
    let client = JSON.parse(localStorage.getItem('selectedClient'));

    if (!client) {
        window.location.href = 'Kontragenty.html';
    } else {
        document.getElementById('client-name').innerText = "🛒 " + client.name;
    }

    async function loadProducts() {
        try {
            const response = await fetch('data.json');
            const data = await response.json();
            products = data.products;
            render();
        } catch (e) { console.error("Ошибка товаров"); }
    }

    function render() {
        const term = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('catalog');
        container.innerHTML = '';

        products.forEach((p, idx) => {
            if (p.name.toLowerCase().includes(term)) {
                const div = document.createElement('div');
                div.className = 'product-item';
                div.innerHTML = `
                    <div>
                        <div class="p-name">${p.name}</div>
                        <div class="p-price">${p.price} сом <span class="p-stock">/ ост: ${p.stock}</span></div>
                    </div>
                    <div class="controls">
                        <button class="btn" onclick="updateQty('${p.name}', -1)">-</button>
                        <span class="count" id="q-${p.name}">${cart[p.name] || 0}</span>
                        <button class="btn btn-plus" onclick="updateQty('${p.name}', 1)">+</button>
                    </div>
                `;
                container.appendChild(div);
            }
        });
    }

    function updateQty(name, delta) {
        cart[name] = (cart[name] || 0) + delta;
        if (cart[name] <= 0) delete cart[name];
        
        let el = document.getElementById('q-' + name);
        if (el) el.innerText = cart[name] || 0;
        
        updateFooter();
    }

    function updateFooter() {
        let total = 0;
        let count = 0;
        products.forEach(p => {
            if (cart[p.name]) {
                total += cart[p.name] * p.price;
                count++;
            }
        });
        
        document.getElementById('footer').style.display = count > 0 ? 'block' : 'none';
        document.getElementById('total-sum').innerText = Math.round(total);
    }

    function sendOrder() {
        const orderData = {
            client: client,
            items: cart,
            total: document.getElementById('total-sum').innerText,
            timestamp: new Date().toLocaleString()
        };
        tg.sendData(JSON.stringify(orderData));
        tg.close();
    }

    document.getElementById('search').oninput = render;
    loadProducts();
</script>
</body>
</html>
