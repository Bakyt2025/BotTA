<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #fff; margin: 0; padding-bottom: 90px; }
        .header { background: #e5f1f6; padding: 12px; font-weight: 600; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; }
        .search-box { padding: 10px; }
        .search { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #f2f2f7; outline: none; box-sizing: border-box; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #f2f2f7; }
        .controls { display: flex; align-items: center; gap: 15px; }
        .btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: #e9e9eb; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-plus { background: #34c759; color: white; }
        .q { min-width: 20px; text-align: center; font-weight: bold; }
        .footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: white; border-top: 1px solid #eee; display: none; }
        .btn-send { width: 100%; padding: 16px; background: #34c759; color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header"><span id="c-name">...</span><a href="Kontragenty.html" style="color:#007aff; text-decoration:none;">Назад</a></div>
    <div class="search-box"><input type="text" id="search" class="search" placeholder="🔍 Поиск товара..."></div>
    <div id="catalog"></div>
    <div id="footer" class="footer"><button class="btn-send" onclick="send()">Заказать: <span id="total">0</span> сом</button></div>

<script>
    let tg = window.Telegram.WebApp;
    let products = []; let cart = {};
    const params = new URLSearchParams(window.location.search);
    let client = params.has('name') ? {name: params.get('name')} : JSON.parse(localStorage.getItem('selectedClient'));

    if (!client) { location.href = 'Kontragenty.html'; }
    else { document.getElementById('c-name').innerText = client.name; }

    async function load() {
        const r = await fetch('data.json');
        const d = await r.json();
        products = d.products;
        render();
    }

    function render() {
        const term = document.getElementById('search').value.toLowerCase();
        const cont = document.getElementById('catalog');
        cont.innerHTML = '';
        
        products.forEach((p, index) => {
            if (p.name.toLowerCase().includes(term)) {
                const div = document.createElement('div');
                div.className = 'item';
                // ВАЖНО: Передаем индекс 'index', а не название строкой
                div.innerHTML = `<div><b>${p.name}</b><br>${p.price} сом</div>
                    <div class="controls">
                        <button class="btn" onclick="upd(${index}, -1)">-</button>
                        <span class="q" id="q-${index}">${cart[p.name] || 0}</span>
                        <button class="btn btn-plus" onclick="upd(${index}, 1)">+</button>
                    </div>`;
                cont.appendChild(div);
            }
        });
    }

    function upd(idx, delta) {
        const p = products[idx];
        if (!cart[p.name]) cart[p.name] = 0;
        cart[p.name] += delta;
        if (cart[p.name] <= 0) delete cart[p.name];
        
        // Обновляем число на экране
        const el = document.getElementById('q-' + idx);
        if (el) el.innerText = cart[p.name] || 0;
