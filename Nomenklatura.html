<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #ffffff; --accent: #34c759; }
        body { font-family: -apple-system, sans-serif; margin: 0; padding-bottom: 80px; background: var(--bg); }
        .header { background: #e5f1f6; padding: 10px 15px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; position: sticky; top: 0; }
        .search-container { padding: 10px; }
        .search { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #eee; background: #f2f2f7; outline: none; box-sizing: border-box; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #f2f2f7; }
        .controls { display: flex; align-items: center; gap: 15px; }
        .btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: #e9e9eb; font-size: 22px; display: flex; align-items: center; justify-content: center; }
        .btn-plus { background: var(--accent); color: white; }
        .footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: white; border-top: 1px solid #eee; display: none; }
        .btn-order { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header"><span id="client-name">Выбор...</span></div>
    <div class="search-container"><input type="text" id="search" class="search" placeholder="Поиск товара..."></div>
    <div id="catalog"></div>
    <div id="footer" class="footer"><button class="btn-order" onclick="send()">Заказать на <span id="total">0</span> сом</button></div>

<script>
    let tg = window.Telegram.WebApp;
    let allP = []; let cart = {};
    const params = new URLSearchParams(window.location.search);
    let client = params.has('name') ? {name: params.get('name')} : JSON.parse(localStorage.getItem('selectedClient'));

    if (!client) { location.href = 'Kontragenty.html'; } 
    else { document.getElementById('client-name').innerText = "🛒 " + client.name; }

    async function load() {
        const r = await fetch('data.json');
        const d = await r.json(); allP = d.products; render();
    }

    function render() {
        const t = document.getElementById('search').value.toLowerCase();
        const c = document.getElementById('catalog'); c.innerHTML = '';
        allP.filter(p => p.name.toLowerCase().includes(t)).forEach(p => {
            const d = document.createElement('div'); d.className = 'product-item';
            d.innerHTML = `<div><b>${p.name}</b><br>${p.price} сом</div>
                <div class="controls">
                    <button class="btn" onclick="upd('${p.name}',-1)">-</button>
                    <b id="q-${p.name}">${cart[p.name]||0}</b>
                    <button class="btn btn-plus" onclick="upd('${p.name}',1)">+</button>
                </div>`;
            c.appendChild(d);
        });
    }

    function upd(n, d) {
        cart[n] = (cart[n]||0) + d; if(cart[n]<=0) delete cart[n];
        let el = document.getElementById('q-'+n); if(el) el.innerText = cart[n]||0;
        let sum = 0; Object.keys(cart).forEach(k => { sum += cart[k] * allP.find(x=>x.name===k).price; });
        document.getElementById('footer').style.display = sum > 0 ? 'block' : 'none';
        document.getElementById('total').innerText = Math.round(sum);
    }

    function send() {
        tg.sendData(JSON.stringify({client: client, items: cart, total: document.getElementById('total').innerText}));
        tg.close();
    }
    document.getElementById('search').oninput = render;
    load();
</script>
</body>
</html>
